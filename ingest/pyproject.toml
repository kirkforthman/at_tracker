[project]
name = "at-ingest"
version = "0.1.0"
description = "at_tracker ingest worker: OpenSky, FAA NAS Status, METAR, enrichment"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["at_ingest"]

[tool.setuptools.package-data]
at_ingest = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
